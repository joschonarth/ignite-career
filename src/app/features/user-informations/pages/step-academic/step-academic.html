<form
  class="space-y-6"
  [formArray]="_curriculumFormStore.academicFormArray"
  (ngSubmit)="goToResume()"
>
  <div class="flex justify-between items-end pb-2">
    <label class="block text-sm font-medium text-zinc-300">Formação Acadêmica</label>

    <button
      type="button"
      (click)="addAcademic()"
      class="text-xs font-bold text-violet-400 hover:text-violet-300 flex items-center gap-1 transition-colors uppercase tracking-wider border border-violet-500/30 px-3 py-1.5 rounded hover:bg-violet-500/10 hover:border-violet-500 cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Adicionar Nova
    </button>
  </div>

  <div class="space-y-4 min-h-[300px]">
    @for (item of academicArrayControls(); track item) {
      <div
        class="group bg-zinc-950 border border-zinc-800 rounded-xl p-6 relative animate-fade-in hover:border-zinc-700 transition-colors"
        [formGroupName]="$index"
      >
        <button
          type="button"
          (click)="removeAcademic($index)"
          class="absolute top-4 right-4 text-zinc-600 hover:text-red-400 p-2 rounded transition-colors cursor-pointer"
          title="Remover Formação"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="col-span-1 md:col-span-2">
            <label class="text-xs text-zinc-500 mb-1 block uppercase">Instituição</label>
            <input
              type="text"
              placeholder="Ex: Universidade Federal"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 text-zinc-200 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-colors font-medium"
              formControlName="institution"
              appInputValidation
              errorMessage="O campo Instituição é obrigatório"
            />
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="text-xs text-zinc-500 mb-1 block uppercase">Curso</label>
            <input
              type="text"
              placeholder="Ex: Ciência da Computação"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 text-zinc-200 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-colors"
              formControlName="course"
              appInputValidation
              errorMessage="O campo Curso é obrigatório"
            />
          </div>

          <div>
            <label class="text-xs text-zinc-500 mb-1 block uppercase">Data de início</label>
            <input
              type="date"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 text-zinc-200 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-colors"
              formControlName="startDate"
              appInputValidation
              errorMessage="O campo Data de início é obrigatório"
            />
          </div>

          <div>
            <label class="text-xs text-zinc-500 mb-1 block uppercase">Data de conclusão</label>
            <input
              type="date"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2 text-zinc-200 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
              formControlName="endDate"
              appInputValidation
              errorMessage="O campo Data de conclusão é obrigatório"
            />
          </div>

          <div class="col-span-1 md:col-span-2">
            <label class="flex items-center gap-3 cursor-pointer w-fit">
              <input
                type="checkbox"
                class="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-violet-600 focus:ring-violet-500 focus:ring-offset-zinc-900 cursor-pointer"
                formControlName="inProgress"
                (change)="onInProgressChange($index)"
              />
              <span class="text-sm text-zinc-400">Em andamento</span>
            </label>
          </div>
        </div>
      </div>
    } @empty {
      <div
        class="flex flex-col items-center justify-center py-12 border-2 border-dashed border-zinc-800 rounded-xl bg-zinc-950/50"
      >
        <div class="bg-zinc-900 p-3 rounded-full mb-3">
          <svg
            class="text-zinc-600"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
            <path d="M6 12v5c3 3 9 3 12 0v-5" />
          </svg>
        </div>
        <p class="text-zinc-500 text-sm">Nenhuma formação registrada.</p>
        <button
          type="button"
          (click)="addAcademic()"
          class="mt-2 text-violet-400 text-sm font-semibold hover:text-violet-300 hover:underline"
        >
          Adicionar agora
        </button>
      </div>
    }
  </div>

  <div class="flex justify-between pt-6 border-t border-zinc-800 mt-6">
    <button
      type="button"
      routerLink="/professional"
      class="text-zinc-400 hover:text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2 cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
      Voltar
    </button>

    <button
      type="submit"
      class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-lg font-bold text-sm tracking-wide transition-all flex items-center gap-2 shadow-lg shadow-emerald-600/20 hover:shadow-emerald-600/40 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none"
      [disabled]="_curriculumFormStore.curriculumFormGroup.invalid"
    >
      ENVIAR CURRÍCULO
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <path d="m22 4-12 12-4-4" />
      </svg>
    </button>
  </div>
</form>
